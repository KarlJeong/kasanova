services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kasanova
      POSTGRES_USER: kasanova
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
