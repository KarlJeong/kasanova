# 동반 테이블(companion tables) 매핑
#
# 스키마 검색/KB 보강 결과 "트리거 테이블"이 후보에 들어오면,
# 여기 정의된 "동반 테이블"을 SQL 생성 이전에 함께 주입한다.
#
# 규칙
# - 1-hop만 지원: 동반 테이블이 또 다른 동반 테이블을 트리거하지 않는다.
# - 이미 후보에 있는 테이블은 중복 주입하지 않는다.
# - 목록이 비어 있으면 주입은 발생하지 않는다.

companions:
  kasa_offering_subscription:
    - kasa_offering

  # 예시:
  # kasa_offering_subscription:
  #   - kasa_offering
